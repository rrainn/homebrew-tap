name: Update Formula

# Triggered by a repository_dispatch event sent from the main LabelTruth repo's
# release-cli workflow.  Updates the version, URLs, and SHA256 checksums in
# Formula/labeltruth.rb to match the new release, then commits and pushes.

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v6.0.2

      - name: Extract release info
        id: release
        run: |
          echo "VERSION=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          echo "TAG=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        run: |
          python3 - <<'PYEOF'
          import re

          version = "${{ steps.release.outputs.VERSION }}"
          tag = "${{ steps.release.outputs.TAG }}"
          darwin_arm64_sha = "${{ github.event.client_payload.darwin_arm64_sha256 }}"
          darwin_x64_sha = "${{ github.event.client_payload.darwin_x64_sha256 }}"
          linux_x64_sha = "${{ github.event.client_payload.linux_x64_sha256 }}"

          formula_path = "Formula/labeltruth.rb"
          with open(formula_path, "r") as f:
              content = f.read()

          base_url = f"https://github.com/rrainn/LabelTruth/releases/download/{tag}"

          # Update version
          content = re.sub(r'version "[^"]*"', f'version "{version}"', content)

          # Update URLs by replacing just the URL string value.
          # This approach is safe regardless of surrounding Ruby syntax
          # (e.g. the `using: GitHubPrivateAssetDownloadStrategy` continuation
          # on the next line is left untouched).
          content = re.sub(
              r'https://github\.com/rrainn/LabelTruth/releases/download/[^/]+/labeltruth-cli-[^"]*-darwin-arm64\.tar\.gz',
              f'{base_url}/labeltruth-cli-{version}-darwin-arm64.tar.gz',
              content,
          )
          content = re.sub(
              r'https://github\.com/rrainn/LabelTruth/releases/download/[^/]+/labeltruth-cli-[^"]*-darwin-x64\.tar\.gz',
              f'{base_url}/labeltruth-cli-{version}-darwin-x64.tar.gz',
              content,
          )
          content = re.sub(
              r'https://github\.com/rrainn/LabelTruth/releases/download/[^/]+/labeltruth-cli-[^"]*-linux-x64\.tar\.gz',
              f'{base_url}/labeltruth-cli-{version}-linux-x64.tar.gz',
              content,
          )

          # Update SHA256 checksums per platform section.
          lines = content.split("\n")
          in_macos_arm64 = False
          in_macos_x64 = False
          in_linux = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              # Track which section we're in
              if "Hardware::CPU.arm?" in stripped:
                  in_macos_arm64 = True
                  in_macos_x64 = False
                  in_linux = False
              elif stripped == "else" and (in_macos_arm64 or in_macos_x64):
                  in_macos_arm64 = False
                  in_macos_x64 = True
              elif stripped.startswith("on_linux do"):
                  in_macos_arm64 = False
                  in_macos_x64 = False
                  in_linux = True
              elif stripped == "end" and (in_macos_arm64 or in_macos_x64):
                  # End of on_macos block
                  in_macos_arm64 = False
                  in_macos_x64 = False
              elif stripped == "end" and in_linux:
                  in_linux = False

              # Replace sha256 in the correct section
              if in_macos_arm64 and stripped.startswith("sha256"):
                  lines[i] = re.sub(r'sha256 "[a-f0-9]{64}"', f'sha256 "{darwin_arm64_sha}"', line)
              elif in_macos_x64 and stripped.startswith("sha256"):
                  lines[i] = re.sub(r'sha256 "[a-f0-9]{64}"', f'sha256 "{darwin_x64_sha}"', line)
              elif in_linux and stripped.startswith("sha256"):
                  lines[i] = re.sub(r'sha256 "[a-f0-9]{64}"', f'sha256 "{linux_x64_sha}"', line)

          content = "\n".join(lines)

          with open(formula_path, "w") as f:
              f.write(content)

          print("=== Updated formula ===")
          print(content)

          # Verify: count sha256 entries with real hex values
          sha_count = len(re.findall(r'sha256 "[a-f0-9]{64}"', content))
          if sha_count != 3:
              print(f"ERROR: Expected 3 SHA256 entries, found {sha_count}")
              exit(1)
          print(f"Formula syntax check passed ({sha_count} SHA256 entries)")

          # Verify: private-repo download strategy class is present
          if "GitHubPrivateAssetDownloadStrategy" not in content:
              print("ERROR: GitHubPrivateAssetDownloadStrategy class is missing")
              exit(1)
          print("Private repo auth check passed (GitHubPrivateAssetDownloadStrategy present)")
          PYEOF

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/labeltruth.rb
          git diff --cached --quiet || git commit -m "Update labeltruth to ${{ steps.release.outputs.VERSION }}"
          git push
