name: Update Formula

# Triggered by a repository_dispatch event sent from the main LabelTruth repo's
# release-cli workflow.  Updates the version, URLs, and SHA256 checksums in
# Formula/labeltruth.rb to match the new release, then commits and pushes.

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v6.0.2

      - name: Extract release info
        id: release
        run: |
          echo "VERSION=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          echo "TAG=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        run: |
          python3 - <<'PYEOF'
          import re

          version = "${{ steps.release.outputs.VERSION }}"
          tag = "${{ steps.release.outputs.TAG }}"
          darwin_arm64_sha = "${{ github.event.client_payload.darwin_arm64_sha256 }}"
          darwin_x64_sha = "${{ github.event.client_payload.darwin_x64_sha256 }}"
          linux_x64_sha = "${{ github.event.client_payload.linux_x64_sha256 }}"

          formula_path = "Formula/labeltruth.rb"
          with open(formula_path, "r") as f:
              content = f.read()

          base_url = f"https://github.com/rrainn/LabelTruth/releases/download/{tag}"

          # Update version
          content = re.sub(r'version "[^"]*"', f'version "{version}"', content)

          # Update macOS arm64 URL and SHA256
          content = re.sub(
              r'url ".*darwin-arm64\.tar\.gz"',
              f'url "{base_url}/labeltruth-cli-{version}-darwin-arm64.tar.gz"',
              content,
          )
          content = content.replace("PLACEHOLDER_DARWIN_ARM64", darwin_arm64_sha)

          # Update macOS x64 URL and SHA256
          content = re.sub(
              r'url ".*darwin-x64\.tar\.gz"',
              f'url "{base_url}/labeltruth-cli-{version}-darwin-x64.tar.gz"',
              content,
          )
          content = content.replace("PLACEHOLDER_DARWIN_X64", darwin_x64_sha)

          # Update Linux x64 URL and SHA256
          content = re.sub(
              r'url ".*linux-x64\.tar\.gz"',
              f'url "{base_url}/labeltruth-cli-{version}-linux-x64.tar.gz"',
              content,
          )
          content = content.replace("PLACEHOLDER_LINUX_X64", linux_x64_sha)

          # For subsequent updates (when PLACEHOLDERs are already replaced),
          # the .replace() calls above are no-ops. We need a second pass that
          # replaces actual 64-char hex SHA256 strings per platform section.
          # Split into sections and replace the sha256 in each section.
          # This is handled by the PLACEHOLDER replacement on first release, and
          # the section-based replacement below for subsequent releases.

          # More robust approach: replace all remaining old sha256 values per section
          lines = content.split("\n")
          in_macos_arm64 = False
          in_macos_x64 = False
          in_linux = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              # Track which section we're in
              if "Hardware::CPU.arm?" in stripped:
                  in_macos_arm64 = True
                  in_macos_x64 = False
                  in_linux = False
              elif "else" in stripped and (in_macos_arm64 or in_macos_x64):
                  in_macos_arm64 = False
                  in_macos_x64 = True
              elif stripped.startswith("on_linux do"):
                  in_macos_arm64 = False
                  in_macos_x64 = False
                  in_linux = True
              elif "end" in stripped and (in_macos_arm64 or in_macos_x64):
                  # End of on_macos block
                  in_macos_arm64 = False
                  in_macos_x64 = False
              elif "end" in stripped and in_linux:
                  in_linux = False

              # Replace sha256 in the correct section
              if in_macos_arm64 and stripped.startswith("sha256"):
                  lines[i] = re.sub(r'sha256 "[a-f0-9]{64}"', f'sha256 "{darwin_arm64_sha}"', line)
              elif in_macos_x64 and stripped.startswith("sha256"):
                  lines[i] = re.sub(r'sha256 "[a-f0-9]{64}"', f'sha256 "{darwin_x64_sha}"', line)
              elif in_linux and stripped.startswith("sha256"):
                  lines[i] = re.sub(r'sha256 "[a-f0-9]{64}"', f'sha256 "{linux_x64_sha}"', line)

          content = "\n".join(lines)

          with open(formula_path, "w") as f:
              f.write(content)

          print("=== Updated formula ===")
          print(content)

          # Verify: count sha256 entries with real hex values
          sha_count = len(re.findall(r'sha256 "[a-f0-9]{64}"', content))
          if sha_count != 3:
              print(f"ERROR: Expected 3 SHA256 entries, found {sha_count}")
              exit(1)
          print(f"Formula syntax check passed ({sha_count} SHA256 entries)")
          PYEOF

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/labeltruth.rb
          git diff --cached --quiet || git commit -m "Update labeltruth to ${{ steps.release.outputs.VERSION }}"
          git push