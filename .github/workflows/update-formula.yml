name: Update Formula

# Triggered by a repository_dispatch event sent from the main LabelTruth repo's
# release-cli workflow.  Updates the version, URLs, and SHA256 checksums in
# Formula/labeltruth.rb to match the new release, then commits and pushes.

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v6.0.2

      - name: Extract release info
        id: release
        run: |
          echo "VERSION=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          echo "TAG=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        run: |
          VERSION="${{ steps.release.outputs.VERSION }}"
          TAG="${{ steps.release.outputs.TAG }}"
          DARWIN_ARM64_SHA="${{ github.event.client_payload.darwin_arm64_sha256 }}"
          DARWIN_X64_SHA="${{ github.event.client_payload.darwin_x64_sha256 }}"
          LINUX_X64_SHA="${{ github.event.client_payload.linux_x64_sha256 }}"

          FORMULA="Formula/labeltruth.rb"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"

          # Update macOS arm64 URL and SHA256
          sed -i "s|url \".*darwin-arm64\.tar\.gz\"|url \"https://github.com/rrainn/LabelTruth/releases/download/${TAG}/labeltruth-cli-${VERSION}-darwin-arm64.tar.gz\"|" "$FORMULA"
          sed -i "s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"${DARWIN_ARM64_SHA}\"/" "$FORMULA"

          # Update macOS x64 URL and SHA256
          # (URL update uses same pattern; only one per platform)
          sed -i "s|url \".*darwin-x64\.tar\.gz\"|url \"https://github.com/rrainn/LabelTruth/releases/download/${TAG}/labeltruth-cli-${VERSION}-darwin-x64.tar.gz\"|" "$FORMULA"

          # Update Linux x64 URL and SHA256
          sed -i "s|url \".*linux-x64\.tar\.gz\"|url \"https://github.com/rrainn/LabelTruth/releases/download/${TAG}/labeltruth-cli-${VERSION}-linux-x64.tar.gz\"|" "$FORMULA"
          # Replace the Linux sha256 (last one in the file)
          sed -i "0,/sha256 \"[a-f0-9]\{64\}\"/{s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"PLACEHOLDER_LINUX_X64\"/}" "$FORMULA"
          # Now handle: there may be multiple sha256 lines; we need to replace
          # the last occurrence. We'll use perl for that.
          perl -pi -e 's/sha256 "[a-f0-9]{64}"/sha256 "${\LINUX_X64_SHA}"/ if ++$count == 3' "$FORMULA"

          # Show the updated formula for debugging
          echo "=== Updated formula ==="
          cat "$FORMULA"

      - name: Verify formula syntax
        run: |
          # Basic sanity check: ensure all three sha256 fields are no longer PLACEHOLDER
          # and are valid 64-char hex strings
          FORMULA="Formula/labeltruth.rb"
          SHA_COUNT=$(grep -c 'sha256 "[a-f0-9]\{64\}"' "$FORMULA" || true)
          if [ "$SHA_COUNT" -ne 3 ]; then
            echo "ERROR: Expected 3 SHA256 entries, found $SHA_COUNT"
            cat "$FORMULA"
            exit 1
          fi
          echo "Formula syntax check passed"

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/labeltruth.rb
          git commit -m "Update labeltruth to ${{ steps.release.outputs.VERSION }}"
          git push